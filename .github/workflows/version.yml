name: Version

# Opens or updates the "Version Packages" pull request. It never builds, packs or publishes (D63).
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write # to dispatch ci.yml on the version branch

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - run: pnpm install --frozen-lockfile
      - id: changesets
        uses: changesets/action/version@v2
      # Pushes made with GITHUB_TOKEN trigger no workflows, so start CI on the version branch by hand.
      - name: Dispatch CI for the version pull request
        if: steps.changesets.outputs.pr-number != ''
        run: gh workflow run ci.yml --ref changeset-release/main
        env:
          GH_TOKEN: ${{ github.token }}
